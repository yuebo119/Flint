<!DOCTYPE html>
<html lang="{{ site.language }}">
<head>
{{ include "partials/head.html" }}
</head>
<body>
{{ include "partials/header.html" }}
<main>
<article>
    <h1>{{ page.title }}</h1>
    <div class="meta">
        {{ if page.date }}
        <time>{{ page.date }}</time>
        {{ end }}
    </div>
    <div class="content">
        {{ page.content }}
    </div>
    
    {{ include "partials/translations.html" }}
</article>
</main>
{{ include "partials/footer.html" }}
</body>
</html>
