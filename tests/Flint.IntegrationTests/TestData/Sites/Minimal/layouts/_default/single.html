<!DOCTYPE html>
<html lang="{{ site.language }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | {{ site.title }}</title>
</head>
<body>
    <header>
        <h1>{{ site.title }}</h1>
    </header>
    <main>
        <article>
            <h1>{{ page.title }}</h1>
            <div class="content">
                {{ page.content }}
            </div>
        </article>
    </main>
</body>
</html>
