<!DOCTYPE html>
<html lang="{{ site.language }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | {{ site.title }}</title>
</head>
<body>
    <header>
        <h1>{{ site.title }}</h1>
    </header>
    <main>
        <h2>{{ page.title }}</h2>
        <ul>
        {{ for item in page.pages }}
            <li><a href="{{ item.permalink }}">{{ item.title }}</a></li>
        {{ end }}
        </ul>
    </main>
</body>
</html>
