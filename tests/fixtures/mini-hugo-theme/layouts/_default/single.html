{{ define "title" }}{{ .Title }} — {{ .Site.Title }}{{ end }}
{{ define "main" }}
<article>
  <h1>{{ .Title }}</h1>
  <time>{{ .Date.Format "2006-01-02" }}</time>
  <div>{{ .Content }}</div>
  {{ with .Params.author }}<p class="author">{{ . }}</p>{{ end }}
  {{ if .Params.tags }}<ul>{{ range .Params.tags }}<li>{{ . }}</li>{{ end }}</ul>{{ end }}
</article>
{{ end }}
