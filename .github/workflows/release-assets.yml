# 跨平台发布资产：linux/osx 的 AOT 单文件打包并挂到 Release
# 两种触发（标准发布流程）：
#   1. release 页发布（published）→ 自动按标签打包三平台资产
#   2. workflow_dispatch 手动指定 tag → 存量标签补建资产
name: release-assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要打包的标签（如 v0.1.1）"
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64
    env:
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: 安装 linux AOT 工具链
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: 发布 AOT
        run: dotnet publish src/Flint.Cli -c Release -r ${{ matrix.rid }} --self-contained -p:PublishAot=true

      - name: 整理产物
        shell: bash
        run: |
          mkdir -p dist
          # TFM 目录名不写死（net11.0 之后还会变）：按 glob 定位发布目录，
          # 此前硬编码 net10.0 会让本步骤在 TFM 升级后必然失败
          PDT=$(ls -d src/Flint.Cli/bin/Release/net*/${{ matrix.rid }}/publish 2>/dev/null | head -n 1)
          if [ -z "$PDT" ]; then
            echo "未找到 AOT 发布产物目录: src/Flint.Cli/bin/Release/net*/${{ matrix.rid }}/publish" >&2
            exit 1
          fi
          NAME="Flint-${TAG}-${{ matrix.rid }}"
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            P="$PDT/Flint.exe"
            NAME="$NAME.exe"
          else
            P="$PDT/Flint"
          fi
          cp "$P" "dist/$NAME"
          echo "ASSET_NAME=$NAME" >> "$GITHUB_ENV"

      - name: 上传到 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" "dist/$ASSET_NAME" --clobber
