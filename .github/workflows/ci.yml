# CI：push/PR 快检（windows 构建+单测+门禁 / ubuntu 冒烟）+ nightly 全量抓偶发
# 测试执行说明：xUnit v3 + Microsoft.Testing.Platform 在 .NET 10 SDK 上拒绝
# VSTest 通道（dotnet test 报 NETSDK1045 同类错误），故用 dotnet run 直跑
# MTP 可执行文件（退出码即测试结果，CI 门禁语义不变）。
# -parallelMode none：单测套件强制串行——并行模式下偶发失败约 4%
# （AsyncLocal 构建态被并发测试交错读写，串行 12/12 复测坐实），根因
# （污染源测试）待查，串行为既定缓解；34s vs 10s 的成本可接受
name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  schedule:
    - cron: "0 18 * * *"   # 每日 02:00（UTC+8）nightly 全量
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 快检：push/PR 必过。构建 + 单元测试 + AiGate 门禁 18 项
  test-windows:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: 安装 Dart Sass（产品改为外部 CLI）
        # 装当前包名 sass：旧包 dart-sass 的 bin 名是 dart-sass（不是 sass），
        # 产品侧 LocateSassExecutable 找 sass 永远匹配不上——2026-10-22
        # CI 红 19 挂的根因（旧路径因 DartSass.Native procDir 兜底从未暴露）
        run: npm install -g sass
      - name: 定位 Dart Sass 并注入 FLINT_SASS
        uses: ./.github/actions/locate-sass
      - name: 构建（Release）
        # AiGate 非 slnx 成员（G16 独立工具链），slnx 构建只把它作为 Tools.Tests
        # 的传递引用且配置注入丢失（落到 bin/Debug），门禁 step 的 no-build 直跑
        # 找不到 Release 产物——显式补构建（SetConfiguration 元数据实测无效）
        run: |
          dotnet build -c Release
          dotnet build src/Flint.AiGate -c Release
      - name: 单元测试（Flint.Core.Tests）
        run: dotnet run --project tests/Flint.Core.Tests -c Release --no-build -- -parallelMode none
      - name: 工具链测试（Tools.Tests / ThemeMigrator.Tests）
        # 这两个测试项目不在 Flint.slnx 内（独立工具链），此前 CI 完全不覆盖：
        # ThemeMigrator 6742 行 + 103 项测试、DevTools 4705 行的回归无人发现
        run: |
          dotnet build tests/Flint.Tools.Tests -c Release
          dotnet build tests/Flint.ThemeMigrator.Tests -c Release
          dotnet run --project tests/Flint.Tools.Tests -c Release --no-build
          dotnet run --project tests/Flint.ThemeMigrator.Tests -c Release --no-build
      - name: 质量门禁（AiGate gate-check 18 项）
        run: dotnet run --project src/Flint.AiGate -c Release --no-build -- gate-check

  # Linux 冒烟：证明 ext4 下可构建可测试（R6 4.3 Linux 基线的 CI 承载）
  test-ubuntu:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: 安装 Dart Sass（产品改为外部 CLI）
        # 装当前包名 sass：旧包 dart-sass 的 bin 名是 dart-sass（不是 sass），
        # 产品侧 LocateSassExecutable 找 sass 永远匹配不上——2026-10-22
        # CI 红 19 挂的根因（旧路径因 DartSass.Native procDir 兜底从未暴露）
        run: sudo npm install -g sass
      - name: 定位 Dart Sass 并注入 FLINT_SASS
        uses: ./.github/actions/locate-sass
      - name: 构建（Release）
        run: dotnet build -c Release
      - name: 单元测试（Flint.Core.Tests）
        run: dotnet run --project tests/Flint.Core.Tests -c Release --no-build -- -parallelMode none

  # nightly：全量深检。单测连跑 3 轮抓偶发（SubpathAuxOutputTests ~3% 观察项），
  # 集成测试全量（1647 项，本地约 12 分钟），门禁复核
  nightly:
    if: github.event_name == 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: 安装 Dart Sass（产品改为外部 CLI）
        run: npm install -g sass
      - name: 定位 Dart Sass 并注入 FLINT_SASS
        # 同 test-windows：nightly 的单测 3 轮与集成套件同样需要 sass 可发现
        uses: ./.github/actions/locate-sass
      - name: 构建（Release）
        # AiGate 显式补构建（非 slnx 成员，传递构建配置注入落 Debug，见 test-windows 同款注释）
        run: |
          dotnet build -c Release
          dotnet build src/Flint.AiGate -c Release
      - name: 单元测试 × 3 轮（抓偶发）
        run: |
          for i in 1 2 3; do
            echo "=== 第 $i 轮 ==="
            dotnet run --project tests/Flint.Core.Tests -c Release --no-build -- -parallelMode none || exit 1
          done
      - name: 集成测试全量（Flint.IntegrationTests）
        run: dotnet run --project tests/Flint.IntegrationTests -c Release --no-build
      - name: 质量门禁（AiGate gate-check 18 项）
        run: dotnet run --project src/Flint.AiGate -c Release --no-build -- gate-check

  # nightly：Linux（ext4）性能基线——写盘墙的平台对照（R6 4.3 Linux 基线
  # 的 CI 承载，本地 WSL 无发行版故只能上 CI）。Windows NTFS 小文件创建是
  # 万页构建 60-75% 的物理墙（HOTSPOTS.md §3），ext4 对照数据决定「极致
  # 优化」上限评估。报告制（无阈值）：首轮起采集基线，原始日志与汇总上传
  # artifact，回归阈值门禁待基线稳定后补
  perf-linux:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: 发布 AOT CLI（linux-x64，生产形态）
        run: dotnet publish src/Flint.Cli -c Release -r linux-x64 --self-contained -p:PublishAot=true -o tmp/aot-linux
      - name: 双引擎站点级 A/B（300 篇 × 3 轮交错，ext4 + AOT）
        # 第三参传 AOT CLI：JIT 口径会把非渲染段膨胀 10-15 倍稀释渲染优势
        # （JIT 0.727x vs AOT 0.548x，2026-10-22 Windows 实测）
        run: bash scripts/engine-ab.sh 300 3 "$PWD/tmp/aot-linux/Flint"
      - name: 上传性能基线产物（原始日志 + 汇总，保留 30 天）
        uses: actions/upload-artifact@v7
        with:
          name: perf-linux-baseline
          path: tmp/engine-ab/
          retention-days: 30
